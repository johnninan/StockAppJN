[project]
name = "personal-stock-analyst"
version = "0.1.0"
description = "AI-powered Streamlit portfolio analyst"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "groq>=0.30.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=6.0.0",
  "python-dotenv>=1.0.0",
  "scipy>=1.13.0",
  "streamlit>=1.45.0",
  "yfinance>=0.2.65",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.12.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"] # Boundary layers convert third-party failures to UI messages.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
